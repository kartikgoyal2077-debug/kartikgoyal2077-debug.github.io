<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kartik</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.6);
  --bgDark:rgba(0,0,0,.85);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
html,body{height:100%}
body{
  background:#000;
  color:var(--text);
  overflow:hidden;
}

/* background */
.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(to bottom,var(--bgDark),rgba(0,0,0,.95)),
    url("https://www.bing.com/th?id=OHR.FanetteIsland_ZH-CN6466809551_1920x1080.jpg")
    center/cover no-repeat;
  transform:scale(1.1);
  transition:transform 12s ease;
  z-index:-3;
}

/* grain */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/></filter>\
<rect width='120' height='120' filter='url(%23n)' opacity='.035'/>\
</svg>");
}

/* glow */
.glow{
  position:fixed;
  width:460px;
  height:460px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 65%);
  filter:blur(120px);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
  transition:.4s;
}

/* layout */
.wrap{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px;
}
.inner{
  max-width:780px;
  animation:floatText 18s ease-in-out infinite;
}

@keyframes floatText{
  50%{transform:translateY(-12px)}
}

/* reveal */
.line{
  opacity:0;
  transform:translateY(20px);
  animation:reveal 1.6s ease forwards;
}
.line:nth-child(1){animation-delay:.4s}
.line:nth-child(2){animation-delay:1.4s}
.line:nth-child(3){animation-delay:2.6s}
.line:nth-child(4){animation-delay:3.8s}
.line:nth-child(5){animation-delay:5s}

@keyframes reveal{to{opacity:1;transform:none}}

h1{
  font-size:clamp(2.6rem,5vw,4rem);
  font-weight:400;
}

p{
  margin-top:28px;
  font-size:18px;
  color:var(--muted);
  line-height:1.8;
}

.quote{
  margin-top:60px;
  font-size:20px;
  color:var(--muted);
  max-width:700px;
  font-style:italic;
}

.micro{
  margin-top:40px;
  font-size:16px;
  color:var(--muted);
}

/* find me */
.find{
  margin-top:70px;
  display:flex;
  gap:36px;
}
.find a{
  text-decoration:none;
  color:var(--muted);
  font-size:15px;
}
.find a:hover{color:#fff}

/* music */
.player{
  margin-top:90px;
  opacity:.8;
}
.player:hover{opacity:1}
.controls{display:flex;gap:18px}
canvas{width:100%;height:80px}

/* reflection (hidden) */
#reflection{
  display:none;
  margin-top:50px;
  width:100%;
  max-width:600px;
  min-height:140px;
  background:none;
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  padding:16px;
}

/* silence mode */
.silence .player,
.silence .glow{
  display:none;
}

/* buttons */
button{
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  opacity:.7;
}
button:hover{opacity:1}

/* ui */
.top{
  position:fixed;
  top:24px;
  right:24px;
  z-index:10;
  display:flex;
  gap:16px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="glow" id="glow"></div>

<div class="top">
  <button id="silenceBtn">silence</button>
</div>

<div class="wrap">
  <div class="inner">

    <div class="line"><h1>Kartik</h1></div>

    <div class="line">
      <p id="timeText"></p>
    </div>

    <div class="line quote" id="quoteText">Loading today’s thought…</div>

    <div class="line micro">
      Currently learning to move slower, not faster.
    </div>

    <div class="line find">
      <a href="https://www.instagram.com/k4325412" target="_blank">instagram</a>
      <a href="https://x.com/Onlystudy694544" target="_blank">x</a>
      <a href="https://github.com/kartikgoyal2077-debug" target="_blank">github</a>
    </div>

    <div class="player line">
      <button id="playBtn">play / pause</button>
      <canvas id="viz"></canvas>
    </div>

    <textarea id="reflection" placeholder="Write privately. Press . again to hide."></textarea>

  </div>
</div>

<audio id="audio" src="song1.mp3" loop></audio>

<script>
/* time aware */
const hour=new Date().getHours();
const timeText=document.getElementById("timeText");
if(hour<5){timeText.innerText="late night · quiet hours";}
else if(hour<12){timeText.innerText="morning · fresh start";}
else if(hour<18){timeText.innerText="afternoon · steady pace";}
else{timeText.innerText="evening · slowing down";}

/* quote per day */
async function loadQuote(){
  const today=new Date().toDateString();
  if(localStorage.quoteDate===today){
    quoteText.innerText=localStorage.quote;
    return;
  }
  const r=await fetch("https://api.quotable.io/random?tags=wisdom|success");
  const d=await r.json();
  localStorage.quote=`"${d.content}" — ${d.author}`;
  localStorage.quoteDate=today;
  quoteText.innerText=localStorage.quote;
}
loadQuote();

/* glow + parallax */
const glow=document.getElementById("glow");
const bg=document.getElementById("bg");
addEventListener("mousemove",e=>{
  glow.style.left=e.clientX+"px";
  glow.style.top=e.clientY+"px";
  bg.style.transform=`scale(1.1) translate(${(e.clientX/window.innerWidth-.5)*20}px,${(e.clientY/window.innerHeight-.5)*20}px)`;
});

/* silence */
silenceBtn.onclick=()=>{
  document.body.classList.toggle("silence");
};

/* reflection easter egg */
document.addEventListener("keydown",e=>{
  if(e.key==="."){
    reflection.style.display=reflection.style.display==="block"?"none":"block";
  }
});

/* music */
const audio=document.getElementById("audio");
let playing=false;
playBtn.onclick=()=>{
  playing?audio.pause():audio.play();
  playing=!playing;
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) audio.pause();
});

/* visualizer */
const ctx=viz.getContext("2d");
const ac=new (AudioContext||webkitAudioContext)();
const src=ac.createMediaElementSource(audio);
const an=ac.createAnalyser();
src.connect(an);an.connect(ac.destination);
an.fftSize=64;
const data=new Uint8Array(an.frequencyBinCount);

function draw(){
  requestAnimationFrame(draw);
  an.getByteFrequencyData(data);
  ctx.clearRect(0,0,viz.width,viz.height);
  data.forEach((v,i)=>{
    ctx.fillStyle="rgba(255,255,255,.5)";
    ctx.fillRect(i*12,viz.height-v/2,6,v/2);
  });
}
document.addEventListener("click",()=>{ac.resume();draw()},{once:true});
</script>

</body>
</html>
