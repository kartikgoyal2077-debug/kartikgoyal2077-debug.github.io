<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kartik Goyal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0 5px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }

    a:hover {
      background: #fff;
      color: #000;
      transform: translateY(-3px);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- upload profile.jpg to repo -->
    <img src="profile.jpg" class="avatar" alt="Profile">

    <h1>Kartik Goyal</h1>
    <p>A glimpse into my life & journey 🚀</p>

    <a href="https://www.instagram.com/k4325412" target="_blank">📸 Instagram</a>
    <a href="https://x.com/Onlystudy694544" target="_blank">🐦 Twitter / X</a>
    <a href="https://github.com/kartikgoyal2077-debug" target="_blank">💻 GitHub</a>

    <footer>
      © 2026 Kartik Goyal
    </footer>

  </div>
</body>
</html>
