<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kartik Goyal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Syne',sans-serif}

body{
  height:100vh;
  overflow:hidden;
  background:#000;
  color:#fff;
}

/* 🌌 animated gradient */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, #38bdf8, transparent 40%),
    radial-gradient(circle at 80% 70%, #a855f7, transparent 40%),
    radial-gradient(circle at 50% 50%, #22c55e, transparent 40%);
  filter: blur(120px);
  animation: move 18s infinite alternate ease-in-out;
}
@keyframes move{
  0%{transform:scale(1)}
  100%{transform:scale(1.4) rotate(20deg)}
}

.app{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  font-size:clamp(2.5rem,6vw,4rem);
  letter-spacing:-1px;
  animation: reveal 1.2s ease forwards;
}
@keyframes reveal{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:none}
}

p{
  margin-top:12px;
  opacity:.7;
  animation: reveal 1.6s ease forwards;
}

.links{
  margin-top:40px;
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  justify-content:center;
}

a{
  text-decoration:none;
  color:#fff;
  font-size:18px;
  position:relative;
}
a::after{
  content:'';
  position:absolute;
  left:0;bottom:-4px;
  width:0;height:2px;
  background:#fff;
  transition:.3s;
}
a:hover::after{width:100%}

/* 🎧 fake audio visualizer */
.visualizer{
  display:flex;
  gap:6px;
  margin-top:50px;
}
.bar{
  width:6px;
  height:30px;
  background:#fff;
  animation: beat 1s infinite ease-in-out;
}
.bar:nth-child(odd){animation-delay:.2s}
.bar:nth-child(even){animation-delay:.4s}

@keyframes beat{
  0%,100%{height:12px;opacity:.4}
  50%{height:48px;opacity:1}
}

.controls{
  margin-top:30px;
  display:flex;
  gap:20px;
}
button{
  background:none;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
}
button:hover{background:rgba(255,255,255,.15)}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app">
  <h1>Kartik Goyal</h1>
  <p>building • learning • experimenting</p>

  <div class="links">
    <a href="https://www.instagram.com/k4325412" target="_blank">Instagram</a>
    <a href="https://x.com/Onlystudy694544" target="_blank">X</a>
    <a href="https://github.com/kartikgoyal2077-debug" target="_blank">GitHub</a>
  </div>

  <div class="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <div class="controls">
    <button onclick="play()">▶ Play</button>
    <button onclick="next()">⏭ Next</button>
  </div>
</div>

<audio id="audio"></audio>

<script>
const songs=["song1.mp3","song2.mp3","song3.mp3"];
let i=0;
const audio=document.getElementById("audio");
audio.src=songs[i];

function play(){audio.play()}
function next(){
  i=(i+1)%songs.length;
  audio.src=songs[i];
  audio.play();
}

document.addEventListener("click",()=>audio.play().catch(()=>{}),{once:true});
</script>

</body>
</html>
