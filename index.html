<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kartik</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.6);
  --accent:rgba(255,255,255,.9);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
html,body{min-height:100%}

body{
  background:#000;
  color:var(--text);
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */
.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.8)),
    url("https://www.bing.com/th?id=OHR.FanetteIsland_ZH-CN6466809551_1920x1080.jpg")
    center/cover no-repeat;
  transform:scale(1.08);
  transition:transform 12s ease;
  z-index:-3;
}

/* grain */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/></filter>\
<rect width='120' height='120' filter='url(%23n)' opacity='.035'/>\
</svg>");
}

/* glow (desktop only) */
.glow{
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);
  filter:blur(120px);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:-1;
}

/* layout */
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 24px;
}
.inner{
  max-width:780px;
  width:100%;
  animation:floatText 14s ease-in-out infinite;
}

@keyframes floatText{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* reveal */
.line{
  opacity:0;
  transform:translateY(20px);
  animation:reveal 1.6s ease forwards;
}
.line:nth-child(1){animation-delay:.4s}
.line:nth-child(2){animation-delay:1.4s}
.line:nth-child(3){animation-delay:2.6s}
.line:nth-child(4){animation-delay:3.8s}
.line:nth-child(5){animation-delay:5s}

@keyframes reveal{to{opacity:1;transform:none}}

h1{
  font-size:clamp(2.2rem,6vw,4rem);
  font-weight:400;
  text-align:center;
}

p{
  margin-top:24px;
  font-size:clamp(16px,4vw,18px);
  color:var(--muted);
  line-height:1.8;
  text-align:center;
}

.quote{
  margin-top:50px;
  font-size:clamp(18px,4.5vw,20px);
  color:var(--muted);
  max-width:700px;
  margin-inline:auto;
  text-align:center;
  font-style:italic;
}

/* about */
.about{
  margin-top:50px;
  font-size:15px;
  color:var(--muted);
  max-width:600px;
  margin-inline:auto;
  text-align:center;
}

/* find me */
.find{
  margin-top:60px;
  display:flex;
  gap:28px;
  justify-content:center;
  flex-wrap:wrap;
}
.find a{
  text-decoration:none;
  color:var(--muted);
  font-size:14px;
  position:relative;
}
.find a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0;
  height:1px;
  background:var(--accent);
  transition:.4s;
}
.find a:hover{color:var(--accent)}
.find a:hover::after{width:100%}

/* music */
.player{
  margin-top:70px;
  display:flex;
  flex-direction:column;
  gap:16px;
  opacity:.9;
  align-items:center;
}
.controls{
  display:flex;
  gap:20px;
}

button,select{
  background:none;
  border:none;
  color:var(--text);
  font-size:15px;
  cursor:pointer;
}

canvas{
  width:100%;
  max-width:600px;
  height:80px;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px){
  .glow{display:none;}
  .inner{animation:none;}
  .bg{transform:scale(1);}
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="glow" id="glow"></div>

<div class="wrap">
  <div class="inner">

    <div class="line">
      <h1>Kartik</h1>
    </div>

    <div class="line">
      <p>
        An evolving space —<br>
        reflection, presence, quiet motion.
      </p>
    </div>

    <div class="line quote" id="quoteText">
      Loading today’s thought…
    </div>

    <div class="line about">
      Here I record thoughts, reflect on moments,  
      and let quiet intuition speak.
    </div>

    <div class="line find">
      <a href="https://www.instagram.com/k4325412" target="_blank">instagram</a>
      <a href="https://x.com/Onlystudy694544" target="_blank">x</a>
      <a href="https://github.com/kartikgoyal2077-debug" target="_blank">github</a>
    </div>

    <div class="player line">
      <select id="trackSelect">
        <option value="song1.mp3">focus</option>
        <option value="song2.mp3">calm</option>
        <option value="song3.mp3">late night</option>
      </select>

      <div class="controls">
        <button id="playBtn">play / pause</button>
        <button id="nextBtn">next</button>
      </div>

      <canvas id="viz"></canvas>
    </div>

  </div>
</div>

<audio id="audio"></audio>

<script>
/* detect touch */
const isTouch = "ontouchstart" in window;

/* glow + parallax (desktop only) */
if(!isTouch){
  const glow=document.getElementById("glow");
  const bg=document.getElementById("bg");
  window.addEventListener("mousemove",e=>{
    const x=e.clientX/window.innerWidth-.5;
    const y=e.clientY/window.innerHeight-.5;
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
    bg.style.transform=`scale(1.08) translate(${x*20}px,${y*20}px)`;
  });
}

/* QUOTES — FIXED */
async function getQuote(){
  try{
    const res = await fetch("https://api.quotable.io/random?tags=success|wisdom");
    if(!res.ok) throw new Error();
    const data = await res.json();
    quoteText.innerText = `"${data.content}" — ${data.author}`;
    sessionStorage.quote = quoteText.innerText;
  }catch{
    quoteText.innerText = sessionStorage.quote ||
      "“Quiet progress compounds.”";
  }
}
getQuote();

/* MUSIC */
const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const nextBtn=document.getElementById("nextBtn");
const select=document.getElementById("trackSelect");

audio.src = select.value;
let playing=false;

playBtn.onclick=()=>{
  playing ? audio.pause() : audio.play();
  playing=!playing;
};

nextBtn.onclick=()=>{
  select.selectedIndex=(select.selectedIndex+1)%select.options.length;
  audio.src=select.value;
  audio.play();
  playing=true;
};

select.onchange=()=>{
  audio.src=select.value;
  audio.play();
  playing=true;
};

/* VISUALIZER */
const vizCtx=viz.getContext("2d");
const audioCtx=new (AudioContext||webkitAudioContext)();
const srcNode=audioCtx.createMediaElementSource(audio);
const analyser=audioCtx.createAnalyser();
srcNode.connect(analyser);
analyser.connect(audioCtx.destination);
analyser.fftSize=128;
const dataArray=new Uint8Array(analyser.frequencyBinCount);

function drawViz(){
  requestAnimationFrame(drawViz);
  analyser.getByteFrequencyData(dataArray);
  vizCtx.clearRect(0,0,viz.width,viz.height);
  const step=viz.width/dataArray.length;
  dataArray.forEach((v,i)=>{
    vizCtx.fillStyle="rgba(255,255,255,.5)";
    vizCtx.fillRect(i*step, viz.height-v/2, step-1, v/2);
  });
}

document.addEventListener("click",()=>{
  audioCtx.resume();
  drawViz();
},{once:true});
</script>

</body>
</html>
